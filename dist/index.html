<body>

    <!-- Pantalla de Carga: olas x8 picos, amplitud máxima -->

                </path>
                <!-- Capa media - 7 picos medios -->
                <path d="M0,60 C60,110 120,10 180,60 C240,110 300,10 360,60 C420,110 480,10 540,60 C600,110 660,10 720,60 C780,110 840,10 900,60 C960,110 1020,10 1080,60 C1140,110 1200,10 1260,60 C1320,110 1380,10 1440,60 L1440,120 L0,120 Z" fill="#2e2e2e">
                    <animate attributeName="d" dur="2.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" values="M0,60 C60,110 120,10 180,60 C240,110 300,10 360,60 C420,110 480,10 540,60 C600,110 660,10 720,60 C780,110 840,10 900,60 C960,110 1020,10 1080,60 C1140,110 1200,10 1260,60 C1320,110 1380,10 1440,60 L1440,120 L0,120 Z;M0,60 C60,10 120,110 180,60 C240,10 300,110 360,60 C420,10 480,110 540,60 C600,10 660,110 720,60 C780,10 840,110 900,60 C960,10 1020,110 1080,60 C1140,10 1200,110 1260,60 C1320,10 1380,110 1440,60 L1440,120 L0,120 Z;M0,60 C60,110 120,10 180,60 C240,110 300,10 360,60 C420,110 480,10 540,60 C600,110 660,10 720,60 C780,110 840,10 900,60 C960,110 1020,10 1080,60 C1140,110 1200,10 1260,60 C1320,110 1380,10 1440,60 L1440,120 L0,120 Z" />
                </path>

        </div>
        <div class="loader-content">
            <div class="loading-text" id="loading-text-wave">loading...</div>
            <button id="start-btn" data-i18n="start_btn" style="display:none;">Ver portafolio de Wilmer Warnes</button>
            <div class="loader-options" style="display:none;">
                <button class="loader-icon-btn is-on" id="music-choice-btn" type="button" role="switch" aria-checked="true" title="Música">
                    <i class="fa-solid fa-music"></i>
                    <span class="loader-icon-text" id="music-choice-label">ON</span>
                </button>
                <button class="loader-icon-btn" id="loader-lang-btn" title="Español / English">ES</button>
            </div>
        </div>
    </div>

    <header class="hud-header">
        <button class="brand-logo" onclick="goToBrandHome()" aria-label="Ir a Inicio">
            <img src="/portafolioTest11/assets/sign_wilmer-DcVdw5QP.png" alt="Wilmer Warnes">
        </button>

        <nav class="hud-nav" id="hud-nav">
            <button class="nav-shortcut" data-section-index="0" onclick="jumpToSection(0)" data-i18n="nav_home">Inicio</button>
            <button class="nav-shortcut" data-section-index="1" onclick="jumpToSection(1)" data-i18n="nav_about">Sobre Mí</button>
            <button class="nav-shortcut" data-section-index="2" onclick="jumpToSection(2)" data-i18n="nav_projects">Proyectos</button>
            <button class="nav-shortcut" data-section-index="3" onclick="jumpToSection(3)" data-i18n="nav_contact">Contacto</button>
        </nav>

        <div class="hud-controls" id="hud-controls">
            <button class="control-btn mobile-controls-toggle" id="mobile-controls-toggle" aria-label="Controles" title="Controles"><i class="fa-solid fa-ellipsis"></i></button>
            <div class="hud-controls-group" id="hud-controls-group">
            <button class="control-btn" id="lang-toggle-btn" title="Cambiar Idioma / Change Language">ES</button>

            <div class="audio-menu-container">
                <button class="control-btn" id="audio-menu-toggle" title="Opciones de Audio"><i class="fa-solid fa-music"></i></button>
                <div class="audio-dropdown" id="audio-dropdown">
                    <h4 data-i18n="audio_title">Centro de Audio Pro</h4>
                    <div class="audio-option">
                        <label data-i18n="audio_status">Estado</label>
                        <button id="master-audio-btn" class="sub-btn" data-i18n="audio_pause">Pausar</button>
                    </div>
                    <div class="audio-option audio-nav-row">
                        <label data-i18n="audio_track">Pista Actual</label>
                        <div class="track-selector-box">
                            <button id="prev-track" class="sub-btn"><i class="fa-solid fa-chevron-left"></i></button>
                            <span id="track-name-display">Cargando...</span>
                            <button id="next-track" class="sub-btn"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="audio-option">
                        <label data-i18n="audio_vol_music">Volumen Música</label>
                        <input type="range" id="volume-slider-music" min="0" max="1" step="0.05" value="0.3">
                    </div>
                    <div class="audio-option">
                        <label data-i18n="audio_vol_sfx">Volumen Efectos</label>
                        <input type="range" id="volume-slider-sfx" min="0" max="1" step="0.05" value="0.5">
                    </div>
                    <div class="audio-option">
                        <label data-i18n="audio_sfx">Efectos UI (SFX)</label>
                        <input type="checkbox" id="sfx-toggle" checked>
                    </div>
                    <div class="audio-option">
                        <label data-i18n="glow_label">Brillo Tarjetas</label>
                        <input type="range" id="glow-slider" min="0" max="3" step="0.1" value="1">
                    </div>
                </div>
            </div>
            </div>
        </div>
    </header>

    <canvas id="webgl-canvas"></canvas>

    <!-- CAPA CSS3D — Proyectos (x3), Perfil y Contacto viven acá en escritorio y móvil.
         En móvil se reescala la misma capa (ver main.js: PROJECT_CARD_SCALE_MOBILE, etc.). -->
    <div id="css3d-layer"></div>

    <!-- Flechas para cambiar de categoría (3D / Diseño / Edición) SOLO en móvil:
         en pantalla angosta las 3 cards se superponen, se muestra una centrada
         a la vez y estas flechas cambian cuál. -->
    <div class="cat-switch-nav" id="cat-switch-nav">
        <button class="gallery-arrow gallery-arrow-left" id="cat-prev" aria-label="Categoria anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="gallery-arrow gallery-arrow-right" id="cat-next" aria-label="Categoria siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="gallery-hud" id="gallery-hud">
        <div class="gallery-hud-top">
            <h2 class="gallery-hud-title" id="gallery-title">Proyectos</h2>
        </div>
        <button class="gallery-arrow gallery-arrow-left" id="gallery-prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="gallery-arrow gallery-arrow-right" id="gallery-next" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="gallery-hud-bottom">
            <button class="back-btn" onclick="closeGallery()"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="modal_back">Volver</span></button>
        </div>
    </div>
